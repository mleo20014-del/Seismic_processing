[project]
name = "seismic_processing"
version = "0.1.0"
description = "Геофизическое desktop-приложение — UI/Rendering слой"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # GUI / QML — кроссплатформенно: Linux, Windows, macOS
    "pyside6>=6.7,<6.12",

    # CUDA-интероп (zero-copy CUDA↔OpenGL, AGENTS.md §3)
    # Требует CUDA toolkit 13.4 в системе (D009).
    # macOS: pycuda недоступен (нет CUDA на Apple Silicon/AMD), импорт условный в interop/
    "pycuda>=2026.1; sys_platform != 'darwin'",

    # Данные
    "numpy>=2.0",
    "zarr>=3.0",
    "numcodecs>=0.14",

    # Сетевой транспорт (ChunkSource Selectel/Cluster — заглушки на Фазе 0, D003)
    "websockets>=14.0",

    # Сжатие чанков
    "blosc2>=3.0",

    # Конфигурация
    "PyYAML>=6.0",

    # Утилиты
    "setuptools>=70.0",
]

[project.optional-dependencies]
# Offline QA-визуализация (НЕ входит в дистрибутив, только Jupyter)
qa = [
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "black>=25.0",
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.10",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "gpu: тесты требующие GPU/CUDA (только self-hosted runner / локально с CUDA)",
    "network: тесты требующие доступа к сетевому ChunkSource эндпоинту",
]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "config*", "core*", "interop*", "ui*", "utils*"]
exclude = ["tests*", "skills*", "shaders*", "scripts*", "docs*", "data*", "models*", "build*"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
