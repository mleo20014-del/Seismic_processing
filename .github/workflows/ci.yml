# .github/workflows/ci.yml — CI для UI/Rendering слоя
#
# Репозиторий: https://github.com/mleo20014-del/Seismic_processing (O001 закрыт)
#
# Шаги соответствуют ci-and-native-deps.md (build-and-workflow skill):
# 1. uv sync
# 2. build_shaders.py --check  (QSB актуальны)
# 3. black --check + ruff check + qmllint
# 4. pytest -m "not gpu and not network"
#
# Платформы: ubuntu-latest, macos-latest (D010 — добавлена macOS)
# GPU-тесты: self-hosted runner с CUDA — раскомментировать после настройки
# Network-тесты: при доступе к тестовому эндпоинту (D003, Фаза 4+)

name: CI

on:
  push:
    branches:
      - "dev/**"
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint + Fast Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync
        # Примечание: pycuda не устанавливается на macOS (sys_platform marker в pyproject.toml)

      - name: Build shaders — check .qsb are committed
        run: uv run python scripts/build_shaders.py --check
        # Пока нет реальных шейдеров (Фаза 0) — шаг проходит без ошибок.
        # После Фазы 5: CI упадёт, если .qsb не закоммичен вместе с .glsl (AGENTS.md §5).

      - name: Lint — black
        run: uv run black --check .

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Lint — qmllint
        run: |
          QMLLINT=$(uv run python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'qmllint'))")
          if [ -f "$QMLLINT" ]; then
            find ui/qml -name "*.qml" -print0 | xargs -0 "$QMLLINT"
          else
            echo "[WARN] qmllint не найден в $(dirname $QMLLINT), пропускаем"
          fi

      - name: Lint — lupdate translations check
        run: |
          # Проверяем, что .ts файлы существуют (i18n инфраструктура, D004/D011)
          if [ ! -f "i18n/seismic_ru.ts" ] || [ ! -f "i18n/seismic_en.ts" ]; then
            echo "[FAIL] Отсутствуют .ts файлы в i18n/. Запустите: uv run python scripts/update_translations.py"
            exit 1
          fi
          echo "[OK] .ts файлы присутствуют"

      - name: Tests (no GPU, no network)
        run: uv run pytest -m "not gpu and not network" -v

  # GPU-тесты — только self-hosted runner с CUDA 13.4 + RTX 3050 (D009, D010)
